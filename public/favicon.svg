<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Outer Background / Transparent -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&amp;family=Cairo:wght@700;800&amp;display=swap');
      .brand-title {
        font-family: 'Tajawal', 'Cairo', sans-serif;
        font-weight: 900;
        font-size: 110px;
        fill: #0f172a;
        letter-spacing: -2px;
      }
      .brand-sub {
        font-family: 'Cairo', 'Tajawal', sans-serif;
        font-weight: 700;
        font-size: 26px;
        fill: #0f172a;
      }
    </style>
  </defs>

  <!-- Circular Border -->
  <circle cx="256" cy="256" r="240" fill="#ffffff" stroke="#0f172a" stroke-width="4"/>
  
  <!-- Logo Art: Top Bar and Geometric Calligraphy -->
  <g transform="translate(256, 230)" text-anchor="middle">
    <!-- Stylized Top Framing Bar -->
    <rect x="-180" y="-105" width="360" height="14" rx="2" fill="#0f172a" />
    
    <!-- Bold Stylized Calligraphic Text -->
    <text x="0" y="-10" class="brand-title" text-anchor="middle" direction="rtl">الرّفاق</text>
    
    <!-- Connecting Bottom Decorative Line -->
    <path d="M -160 5 Q 0 10 160 5" stroke="#0f172a" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Subtitle -->
  <text x="256" y="325" class="brand-sub" text-anchor="middle" direction="rtl">مكتبة الرفاق للطباعة و الخدمات الطلابية</text>
  
  <!-- Decorative Star/Dot Accents -->
  <circle cx="95" cy="316" r="4" fill="#c8a520" />
  <circle cx="417" cy="316" r="4" fill="#c8a520" />
</svg>